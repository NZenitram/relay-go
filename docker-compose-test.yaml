version: '3.8'

services:
  relay-go:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HTTP_SERVER_PORT=8080
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SPLUNK_HOST=${SPLUNK_HOST}
      - SPLUNK_KEY=${SPLUNK_KEY}
      - KAFKA_BROKERS=kafka:9092
      - EMAIL_TOPIC=email-events
      - WEBHOOK_TOPIC_SENDGRID=webhook-events-sendgrid
      - WEBHOOK_TOPIC_SPARKPOST=webhook-events-sparkpost
      - WEBHOOK_TOPIC_POSTMARK=webhook-events-postmark
    depends_on:
      dynamodb-local:
        condition: service_healthy
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data/"
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_REGION=us-east-1
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      relay-go:
        condition: service_healthy
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  ngrok:
    image: wernight/ngrok:latest
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_PUBLIC_URL=${NGROK_PUBLIC_URL}
    ports:
      - "4040:4040"
    depends_on:
      - nginx
    networks:
      - test-net

  redis:
    image: redis:latest
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=your_password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "your_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  test-net:
    driver: bridge

volumes:
  dynamodb-data: 